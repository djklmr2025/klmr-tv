  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #03060c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .tv-screen-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .tv-screen-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Responsive Playout Container -->
  <main class="tv-screen-wrapper">
    <iframe 
      id="klmr-live-stream"
      src="https://klmr-digital-tv.vercel.app/embed?embed=1" 
      title="KLMR DIGITAL TV HD"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
      referrerpolicy="no-referrer"
      sandbox="allow-scripts allow-same-origin allow-presentation allow-fullscreen"
      allowfullscreen>
    </iframe>
  </main>

  <!-- Auto Landscape / Fullscreen Assistant for Mobile Browsers -->
  <script>
    function triggerLandscapeMode() {
      try {
        var doc = document.documentElement;
        var req = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.mozRequestFullScreen || doc.msRequestFullscreen;
        if (req && !document.fullscreenElement) {
          req.call(doc).then(function() {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(function() {});
            }
          }).catch(function() {});
        } else if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function() {});
        }
      } catch (err) {}
    }

    window.addEventListener('click', triggerLandscapeMode, { once: true });
    window.addEventListener('touchstart', triggerLandscapeMode, { once: true });
  </script>
</body>

  <style>
    * {

    html, body {

    .tv-screen-wrapper {

      text-decoration: none;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transition: transform 0.2s, background 0.2s, opacity 0.2s;
    }
    .btn-apk-float:hover {
      transform: scale(1.05);
      background: rgba(0, 255, 136, 0.15);
      border-color: #00ff88;
      opacity: 1 !important;
    }

  <!-- Fullscreen Responsive Playout Container -->

    <span>Instalar APK Android</span>

  <!-- Auto Landscape / Fullscreen Assistant for Mobile Browsers -->
  <script>
    function triggerLandscapeMode() {
      try {
        var doc = document.documentElement;
        var req = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.mozRequestFullScreen || doc.msRequestFullscreen;
        if (req && !document.fullscreenElement) {
          req.call(doc).then(function() {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(function() {});
            }
          }).catch(function() {});
        } else if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function() {});
        }
      } catch (err) {}
    }

    window.addEventListener('click', triggerLandscapeMode, { once: true });
    window.addEventListener('touchstart', triggerLandscapeMode, { once: true });
  </script>
